[pytest]
# 上线验证回归的统一入口配置。
# 用例分组见 markers，按组跑命令示例：
#   ./.venv/bin/pytest -m smoke        # 只跑冒烟（秒级，确认环境通不通）
#   ./.venv/bin/pytest -m chain        # 只跑核心链路（无人值守）
#   ./.venv/bin/pytest -m b_verify     # 只跑核销链路
#   ./.venv/bin/pytest -m refund       # 只跑退款闭环（会真退一笔，生产需写闸门）
#   ./.venv/bin/pytest                 # 全量（默认跳过需要真实资金的用例）
#
# 真实支付闸门（决定"需要花真钱/真人扫码"的用例跑不跑，见 migu_api/fundgate.py）：
#   ./.venv/bin/pytest --real-pay=on     # 允许下新单 + 等真人扫码（会花钱）
#   ./.venv/bin/pytest --real-pay=auto   # 只用已付订单，不花新钱
#   ./.venv/bin/pytest --real-pay=off    # 默认
#   MIGU_REAL_PAY=1 等价于 --real-pay=on；命令行优先。
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: 冒烟 —— 环境连通性与登录态（秒级，出问题先跑这个）
    catalog: 测试商品清单 —— 清单自检/白名单/按需查找（纯本地，秒级，不碰环境）
    chain: 核心链路 —— 商品→下单→支付记录→支付结果（无人值守，不含真实付款）
    b_verify: 核销链路 —— C端出票 → B端核销 → 订单已完成（需 B 端会话）
    refund: 退款链路 —— 可退性→试算→提交→审批→订单已退款（需 B 端会话，会真退一笔）
    real_pay: 真实支付闭环 —— 需人工扫 0.01 元；跑不跑由真实支付闸门决定（--real-pay=on|auto|off）
    reg930: 930 回归用例 —— 《930测试用例V1.2.0/回归用例.xlsx》15 条/16 行，生产 888 店执行（含写操作，需 MIGU_ALLOW_PROD_WRITE=1）
    demo: 教学 demo —— 纯内存模拟，不打真实环境
    release_core: 第一版上线核心回归包 —— 买票/入场/退款/钱票库存状态相关的固定必跑自动化
    release_money: 真实资金专项 —— 真实支付/真实退款，默认不进入无人值守 CI
    release_manual: 人工兜底项 —— 短信、人机验证、破坏性动作等需要人工确认的用例

# 默认把 Allure 结果写到 allure-results，这样 pytest 和 allure 报告共用一份数据。
# 注意：不要在 addopts 里写 --clean-alluredir，避免误删历史结果（清理动作交给 run.sh）。
addopts = --alluredir=allure-results

filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
